<style>

/* =========================
   HERO
========================= */

.hero {
    min-height: 100vh;
    position: relative;

    display: flex;
    align-items: center;

    padding: 130px 7% 70px;

    overflow: hidden;

    background-image:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.98) 0%,
            rgba(255,255,255,0.94) 28%,
            rgba(255,255,255,0.65) 45%,
            rgba(255,255,255,0.18) 68%,
            rgba(255,255,255,0.05) 100%
        ),
        url("birthday-poster.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.hero::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.08),
            rgba(0,0,0,0.05)
        );

    pointer-events: none;
}

.hero-copy {
    position: relative;
    z-index: 2;

    max-width: 580px;
}

.kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 9px 14px;

    border-radius: 50px;

    background: rgba(255,255,255,0.82);

    backdrop-filter: blur(12px);

    color: var(--blue);

    font-size: 11px;
    font-weight: 700;

    letter-spacing: 1.5px;
    text-transform: uppercase;

    box-shadow:
        0 10px 30px rgba(30,76,145,0.10);
}

.kicker i {
    width: 7px;
    height: 7px;

    background: var(--blue);

    border-radius: 50%;
}

h1 {
    margin-top: 25px;

    font-size: clamp(58px, 8vw, 112px);

    line-height: 0.9;

    letter-spacing: -5px;

    color: var(--text);
}

h1 span {
    display: block;

    color: var(--blue);

    font-family: "Playfair Display", serif;

    font-style: italic;
    font-weight: 500;

    letter-spacing: -4px;
}

.hero-text {
    margin-top: 28px;

    max-width: 500px;

    color: #536176;

    font-size: 17px;

    line-height: 1.8;
}


/* =========================
   MOBILE HERO
========================= */

@media(max-width:850px) {

    .hero {
        min-height: 100vh;

        padding: 115px 6% 70px;

        align-items: flex-start;

        background-position: 62% center;

        background-image:
            linear-gradient(
                180deg,
                rgba(255,255,255,0.97) 0%,
                rgba(255,255,255,0.90) 35%,
                rgba(255,255,255,0.30) 65%,
                rgba(255,255,255,0.08) 100%
            ),
            url("birthday-poster.png");
    }

    .hero-copy {
        max-width: 100%;
    }

    h1 {
        font-size: clamp(52px, 15vw, 82px);

        letter-spacing: -3px;
    }
}

</style>


<!-- =========================
     REPLACE YOUR CURRENT HERO HTML
========================= -->

<section class="hero">

    <div class="hero-copy">

        <div class="kicker">
            <i></i>
            A little birthday surprise
        </div>

        <h1>
            Happy Birthday
            <span>Helu.</span>
        </h1>

        <p class="hero-text">

            Today isn't just another day.

            Today we celebrate 27 years of you —
            and I'm grateful that our paths crossed.

            So I made this little corner of the internet
            just for you.

        </p>

        <a
            class="btn"
            href="#letter"
        >
            Open your letter →
        </a>

    </div>

</section>
